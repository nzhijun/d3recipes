[package]
name = "d3cube"
version = "0.1.0"
edition = "2021"
description = "Kanai's Cube route planner (deterministic model)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# no panic = "abort" here: the wasm target aborts anyway, and `cargo test --release` needs unwind, so with it the library
# was built twice under one file name (output filename collision) and the precons binary could link against the wrong one
